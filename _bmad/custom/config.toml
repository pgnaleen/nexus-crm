# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# ─────────────────────────────────────────────────────────────────
# Pinned 2026-07-31. _bmad-output/ was reorganized into numbered,
# self-explanatory folders: "planning-artifacts" -> "1-epics-and-stories",
# "implementation-artifacts" -> "2-current-work".
#
# These are pinned HERE, not in _bmad/config.toml, because that file is
# installer-managed and a reinstall would silently revert it — pointing
# every BMad skill at two folders that no longer exist. This file is never
# touched by the installer.
#
# Do not rename 2-current-work's contents: sprint-status.yaml and
# deferred-work.md are addressed by exact filename inside it, and story
# files must sit directly in it (story_location), not in a subfolder.
# ─────────────────────────────────────────────────────────────────
[modules.bmm]
planning_artifacts = "{project-root}/_bmad-output/1-epics-and-stories"
implementation_artifacts = "{project-root}/_bmad-output/2-current-work"
