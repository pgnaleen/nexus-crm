# Sprint Status — Nexus CRM
#
# Generated 2026-07-31 by reading all four epic files and VERIFYING each story
# against the actual code. Where the docs and the code disagreed, the code won.
# Every correction is listed in ../START-HERE.md under "Doc-vs-code corrections".
#
# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created, ready for development
#   - in-progress: Developer actively working on implementation
#   - review: Implementation complete, ready for review
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# Action Item Status:
#   - open: Committed during a retrospective, not yet addressed
#   - in-progress: Actively being worked on
#   - done: Completed
#
# WORKFLOW NOTES:
# ===============
# - Mark epic as 'in-progress' when starting work on its first story
# - Developer typically creates next story ONLY after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then Dev runs code-review (fresh context, ideally different LLM)
# - Retrospective appends its action items to action_items; sprint-status surfaces open ones
#
# EPIC NUMBERING — IMPORTANT
# ==========================
# BMad requires globally-unique epic numbers: a story key `N-M-slug` must have a
# matching `epic-N` or it is reported as orphaned. The four epic files each call
# their own epic "Epic 1", so they are renumbered globally here. The mapping:
#
#   epic-1 → epics-hr.md              "Epic 1: HR — Employee Directory & Organization Visibility"
#   epic-2 → epics-system.md          "Epic 1: System — UI Modernization (Tailwind/FlyonUI)"
#   epic-3 → epics-task-management.md "Epic 1: Priority Tracker — Eisenhower Task Management"
#   epic-4 → epics-task-management.md "Epic 2: Priority Deck — Prototype v2 Parity"
#   epic-5 → epics-task-management.md "Epic 3: Event-Sourced Flow, Task Chat & Real-Time Sync"
#   epic-6 → epics-user-management.md "Epic 1: User Management — Account Provisioning"
#   epic-7 → epics-activity-log.md     "Epic 1: Activity Log — Audit Trail Visibility"
#
# Story numbers inside each epic are unchanged (epic-3's 3-7 is that file's Story 1.7).

